# Gateway definitions: validate on every change, publish on merge.
#
# The API Connect toolkit is **optional here**, deliberately. It is not on npm
# and is downloaded from API Manager behind a login, so a CI runner can only
# get it if someone publishes a reachable URL. Making the whole job depend on
# that meant every run failed with `curl: (3) URL rejected` until it was set —
# which is what happened, and a CI job that is always red teaches people to
# ignore CI.
#
# So the checks that need no toolkit always run, and `apic validate` runs when
# `vars.APIC_TOOLKIT_URL` is configured. The valuable checks are in the first
# group anyway: that the generated artefact is current, and that it still
# agrees with the contract.

name: gateway

on:
  pull_request:
    paths:
      - 'gateway/**'
      - 'api/openapi/**'
      - 'scripts/build-apic-definition.mjs'
      - '.github/workflows/gateway.yml'
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'api/openapi/**'
      - 'scripts/build-apic-definition.mjs'
      - '.github/workflows/gateway.yml'

concurrency:
  group: gateway-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: The generated artefact must be current
        run: |
          set -euo pipefail
          npm run build:apic
          # A generated file committed stale means the gateway and the
          # contract disagree, and nothing would say so.
          git diff --exit-code gateway/ibm/origination-api_1.0.0.yaml

      - name: The definitions must stay in step with the contract
        run: npx vitest run test/architecture/gateway test/contract/apic-artefact

      # Optional. Skipped, not failed, when no toolkit URL is configured.
      - name: Install the API Connect toolkit
        id: toolkit
        if: vars.APIC_TOOLKIT_URL != ''
        run: |
          set -euo pipefail
          # Not on npm for v10+. `apiconnect` on npm is the v5 toolkit, last
          # published 2023, and cannot talk to a v10 instance.
          curl -fsSL "${{ vars.APIC_TOOLKIT_URL }}" -o toolkit.zip
          unzip -q toolkit.zip -d toolkit
          binary="$(find toolkit -type f -name 'apic*' | head -1)"
          chmod +x "$binary"
          sudo mv "$binary" /usr/local/bin/apic
          apic --accept-license --live-help=false
          apic version

      - name: Validate every definition against the toolkit
        if: steps.toolkit.outcome == 'success'
        run: |
          set -euo pipefail
          failed=0
          for file in gateway/ibm/*-product_*.yaml; do
            echo "── $file"
            apic validate "$file" || failed=1
          done
          exit $failed

      - name: Note when toolkit validation was skipped
        if: vars.APIC_TOOLKIT_URL == ''
        run: |
          echo "::notice::apic validate skipped — set the APIC_TOOLKIT_URL repository variable to enable it."

  publish:
    needs: validate
    # Also requires the toolkit and a credential, so it is skipped rather than
    # failed while either is absent.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.APIC_TOOLKIT_URL != '' &&
      vars.APIC_SERVER != ''
    runs-on: ubuntu-latest
    environment: apic-dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install the API Connect toolkit
        run: |
          set -euo pipefail
          curl -fsSL "${{ vars.APIC_TOOLKIT_URL }}" -o toolkit.zip
          unzip -q toolkit.zip -d toolkit
          binary="$(find toolkit -type f -name 'apic*' | head -1)"
          chmod +x "$binary"
          sudo mv "$binary" /usr/local/bin/apic
          apic --accept-license --live-help=false

      - name: Publish
        run: sh scripts/apic-publish.sh
        env:
          APIC_SERVER: ${{ vars.APIC_SERVER }}
          # provider/ibm-verify on this instance — see gateway/ibm/INSTANCE.md
          APIC_REALM: ${{ vars.APIC_REALM }}
          APIC_ORG: ${{ vars.APIC_ORG }}
          APIC_CATALOG: ${{ vars.APIC_CATALOG }}
          APIC_API_KEY: ${{ secrets.APIC_API_KEY }}
