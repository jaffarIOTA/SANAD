# Security gates — SEC-D01..D17.
#
# A gate that only warns is not a gate: every job below fails the build.
#
# SEC-D17: every action is pinned to a full commit SHA, with the release it
# was resolved from in the trailing comment (resolved 2026-10-08). Update by
# re-resolving the tag to its SHA, never by switching back to a tag.

name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'   # Monday 02:00 — catch newly published CVEs in untouched code

permissions:
  contents: read
  security-events: write

jobs:

  sast-codeql:                                    # SEC-D02
    name: SAST — CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3

  sast-semgrep:                                   # SEC-D03
    name: SAST — Semgrep + Sanad invariant rules
    runs-on: ubuntu-latest
    # Pinned by digest (SEC-D17), the same Semgrep release validated locally on 2026-10-08.
    container: semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # `semgrep scan`, not `semgrep ci`: ci rejects --error and expects a Semgrep App token; scan with
      # --error fails the job on any finding from these rule sets, which is the gate SEC-D03 asks for.
      - run: semgrep scan --config .semgrep/sanad.yml --config p/typescript --config p/owasp-top-ten --config p/secrets --metrics off --error

  secrets-history:                                # SEC-D05
    name: Secrets — full history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }                  # a secret removed later is still leaked
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

  dependencies:                                   # SEC-D06
    name: SCA — dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high
      # v2 takes its arguments one per line; '@v1' never existed as a ref of this action.
      - uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --recursive
            ./

  dependency-review:                              # SEC-D07
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  sbom:                                           # SEC-D08
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: sbom, path: sbom.cdx.json, retention-days: 90 }

  iac-and-containers:                             # SEC-D09, SEC-D10
    name: Trivy — IaC and filesystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (was @master)
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  compliance-gates:                               # SEC-D13
    name: Compliance suite (authorisation-bypass tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      # Enable the versioned pre-commit hook as every developer does (README); the architecture
      # suite asserts it is the configured hooks path and that it bites.
      - run: git config core.hooksPath .githooks
      - run: npm run typecheck
      - run: npm run test:compliance
      # The architecture suite asserts the absences (no vendor in core, no float in pricing, no secret, no PostgREST exposure).
      - run: npx vitest run test/architecture
      # Every suite, in memory (SR-024). With the database job's run, no test is skipped in both.
      - name: Full suite without a database
        run: npx vitest run

  database-controls:                              # SR-003, SR-024
    name: Database controls (RLS at runtime)
    runs-on: ubuntu-latest
    services:
      postgres:
        # The hosted database's own image, so roles, extensions and the vault behave as they do there.
        image: public.ecr.aws/supabase/postgres:17.11.0.002@sha256:0450166354dc9c1d25f0322ac8b580774d4fb0184d2b087f6e4fe9499c66cf53
        env:
          # A throwaway container's password, different every run; nothing else ever reaches it.
          POSTGRES_PASSWORD: run-${{ github.run_id }}-${{ github.run_attempt }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: run-${{ github.run_id }}-${{ github.run_attempt }}
      # Migrations run as the owner, as `supabase db push` does; the tests reach tenant rows only through
      # the runtime role (test/contract/runtime-rls.test.ts proves it binds). No password in the URL:
      # the driver reads PGPASSWORD.
      SANAD_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Apply every migration, in order, from empty
        run: |
          set -euo pipefail
          for f in supabase/migrations/*.sql; do
            echo "::group::$f"
            psql -d postgres -v ON_ERROR_STOP=1 -q -f "$f"
            echo "::endgroup::"
          done
      # Every suite, so the database-backed tests run rather than skip (SR-024). The in-memory-only
      # variants skip here and run in the job above; test/architecture/ci-coverage.test.ts keeps both.
      - name: Full suite against the database
        run: npx vitest run
