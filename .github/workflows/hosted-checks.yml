# Checks of the hosted environment that the repository cannot see (SR-041).
#
# Daily, and on demand. Needs the repository variable SUPABASE_PROJECT_REF and
# the secret SUPABASE_ACCESS_TOKEN; without them the run fails and says so,
# rather than passing on a check it never made.

name: hosted-checks

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exposed-schemas:
    name: PostgREST exposes only public and graphql_public
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/exposed-schemas-check.mjs
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
