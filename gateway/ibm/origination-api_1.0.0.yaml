          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Internal:
      description: |
        An unexpected failure. The correlation identifier is always present;
        quote it. No internal detail, credential or personal datum appears in
        this body.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
x-ibm-configuration:
  type: rest
  phase: realized
  enforced: true
  testable: false
  cors:
    enabled: false
  gateway: datapower-api-gateway
  properties:
    upstream-url:
      value: http://origination.sanad.svc.cluster.local
      description: The origination service, in-cluster. Set per catalog.
      encoded: false
  assembly:
    execute:
      - invoke:
          version: 2.5.0
          title: pass through to the service
          target-url: $(upstream-url)$(request.path)$(request.search)
