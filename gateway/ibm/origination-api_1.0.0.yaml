components:
  securitySchemes:
    partnerOAuth:
      type: oauth2
      description: |
        Both schemes apply together, not as alternatives. The token identifies
        the partner; the certificate binds the channel.
      flows:
        clientCredentials:
          tokenUrl: https://auth.sandbox.sanad.example/oauth2/token
          scopes:
            origination:read: Read requests this partner raised.
            origination:write: Raise and withdraw requests.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required on every state-changing request (§8). The response is
        persisted against the key; a replay with the same key and the same
        body returns the original result verbatim with `Idempotent-Replay:
        true`. The same key with a different body is a `409`, never a second
        request.

        Generate a fresh UUID per logical instruction. Reusing a key across
        two genuinely different instructions will lose one of them.
      schema:
        type: string
        format: uuid
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: |
        Carried through every log, span and audit record for this instruction.
        Supply your own to correlate across both systems; one is generated if
        you do not, and returned either way.
      schema:
        type: string
        format: uuid
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    Location:
      description: The created request.
      schema:
        type: string
        format: uri-reference
    CorrelationId:
      description: The correlation identifier for this instruction.
      schema:
        type: string
        format: uuid
    IdempotentReplay:
      description: Present and `true` when this response was replayed from a stored result.
      schema:
        type: boolean
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
  schemas:
    Money:
      type: object
      additionalProperties: false
      required:
        - minorUnits
        - currency
      description: |
        An amount in minor units, as a string of digits.

        A string rather than a number on purpose. A JSON number is a double in
        most parsers, and §8 forbids floating point in the financial path;
        `48500000` is halalas, so `485,000.00 SAR`. Do not divide it to
        display it — split on the last two digits.
      properties:
        minorUnits:
          type: string
          pattern: ^(0|[1-9][0-9]{0,18})$
          example: "48500000"
        currency:
          type: string
          enum:
            - SAR
          description: Saudi riyal, two minor digits. Extended by agreement, not unilaterally.
    AttestedInstant:
      type: object
      additionalProperties: false
      required:
        - instant
        - attestationRef
      description: |
        A point in time together with the attestation that establishes it.

        Times that carry contractual effect in this system come from an RFC
        3161 timestamping authority, never from a server clock and never from
        a client. The attestation reference is what makes the instant
        replayable by the Board's audit process (SH-18), which is why it
        travels with the value rather than being held somewhere else.
      properties:
        instant:
          type: string
          format: date-time
        attestationRef:
          type: string
          minLength: 1
          maxLength: 128
    TradeReference:
      type: object
      additionalProperties: false
      required:
        - type
        - issuerCr
        - recipientCr
      description: |
        The real trade the financing attaches to.

        `issuerCr` and `recipientCr` are commercial registration numbers, and
        counterparty distinctness is matched on these rather than on names
        (SH-08). Two names that differ are not two parties.
      properties:
        type:
          type: string
          enum:
            - CLEARED_INVOICE
            - PURCHASE_ORDER
        invoiceUuid:
          type: string
          format: uuid
          description: |
            The e-invoicing authority's identifier. Required where `type` is
            `CLEARED_INVOICE`. This is the key the financed-invoice registry
            is unique on (SH-10) — the same invoice cannot be financed twice,
            including after settlement.
        invoiceHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 of the cleared document, lowercase hex.
        issuerCr:
          type: string
          pattern: ^[0-9]{10}$
        recipientCr:
          type: string
          pattern: ^[0-9]{10}$
    Initiator:
      description: |
        What the server cannot already know about who is asking.

        Deliberately thin. The partner or aggregator identity and its
        credential reference come from the authenticated credential, not from
        the body, so a caller cannot assert that it is somebody else. The only
        thing carried here is the merchant's own mandate, which is a fact
        about a third party that the credential does not establish.
      oneOf:
        - $ref: "#/components/schemas/PartnerSystemInitiator"
        - $ref: "#/components/schemas/AggregatorInitiator"
      discriminator:
        propertyName: kind
        mapping:
          PARTNER_SYSTEM: "#/components/schemas/PartnerSystemInitiator"
          AGGREGATOR_ON_BEHALF: "#/components/schemas/AggregatorInitiator"
    PartnerSystemInitiator:
      type: object
      additionalProperties: false
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - PARTNER_SYSTEM
    AggregatorInitiator:
      type: object
      additionalProperties: false
      required:
        - kind
        - merchantMandateRef
      properties:
        kind:
          type: string
          enum:
            - AGGREGATOR_ON_BEHALF
        merchantMandateRef:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            A mandate from the party who will owe the money — the merchant —
            not from the aggregator introducing them. An aggregator's
            commercial interest is not the merchant's consent, and a missing
            or empty mandate is refused.
    RaiseRequest:
      type: object
      additionalProperties: false
      required:
        - programmeId
        - counterpartyId
        - tradeReference
        - requestedAmount
        - requestedTenorDays
        - initiator
      description: |
        Note what is absent: no `tenantId`, no `channel`, no `partnerId`, and
        nothing resembling a rate. All are either derived server-side or do
        not exist. Because this schema is closed, sending one is a `400`
        rather than a silent drop.
      properties:
        programmeId:
          type: string
          format: uuid
        counterpartyId:
          type: string
          format: uuid
        tradeReference:
          $ref: "#/components/schemas/TradeReference"
        requestedAmount:
          $ref: "#/components/schemas/Money"
        requestedTenorDays:
          type: integer
          minimum: 1
          maximum: 365
          description: |
            A determinate tenor in days (SH-03). There is no open-ended or
            "until collected" form — a term that cannot be stated is gharar.
        initiator:
          $ref: "#/components/schemas/Initiator"
        partnerReference:
          type: string
          maxLength: 128
          description: Your own reference, echoed back. Not used for idempotency.
    RequestState:
      type: string
      enum:
        - AWAITING_SERVICING_RESPONSE
        - AWAITING_REVIEW
        - RETURNED_TO_MAKER
        - APPROVED
        - REJECTED
        - WITHDRAWN
        - EXPIRED
      description: |
        `EXPIRED` means nobody acted on the request within the institution's
        configured interval. It is terminal: re-raise rather than expect it to
        be revived, because the trade it named and the limits it was checked
        against may no longer hold.

        `KEYING` is intentionally not in this list. It is the state of a
        request being typed into an internal screen and is never observable
        over this API — a partner's request is created submitted.

        `APPROVED` means a transaction may now be opened in `DRAFT`. It does
        not mean funds, a sale, or an executed contract.
    ServicingOutcome:
      type: object
      additionalProperties: false
      required:
        - decision
        - reference
        - respondedAt
      description: |
        What the servicing platform said about credit capacity — limits,
        exposure, account standing.

        It is an input to the institution's decision and never the decision
        itself. It also has no view whatsoever on sequencing: a servicing
        `APPROVED` says nothing about whether goods were bought, possessed and
        held at risk, and is not consulted about it.
      properties:
        decision:
          type: string
          enum:
            - APPROVED
            - DECLINED
            - REFERRED
        reference:
          type: string
          minLength: 1
          maxLength: 128
        reasonCode:
          type: string
          maxLength: 64
          description: Present on `DECLINED` and `REFERRED`.
        respondedAt:
          $ref: "#/components/schemas/AttestedInstant"
    OriginationRequest:
      type: object
      additionalProperties: false
      required:
        - requestId
        - state
        - channel
        - programmeId
        - counterpartyId
        - tradeReference
        - requestedAmount
        - requestedTenorDays
        - raisedAt
        - correlationId
      description: |
        The reviewing principals are not exposed. Who keyed and who approved a
        request is recorded in full and is available to the Board's audit
        workspace, but it is internal staff identity and a partner has no
        business with it.
      properties:
        requestId:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/RequestState"
        channel:
          type: string
          enum:
            - PARTNER_API
            - EMBEDDED_AGGREGATOR
          description: Derived from the credential. Echoed so you can assert it is what you expected.
        programmeId:
          type: string
          format: uuid
        counterpartyId:
          type: string
          format: uuid
        tradeReference:
          $ref: "#/components/schemas/TradeReference"
        requestedAmount:
          $ref: "#/components/schemas/Money"
        requestedTenorDays:
          type: integer
          minimum: 1
        raisedAt:
          $ref: "#/components/schemas/AttestedInstant"
        correlationId:
          type: string
          format: uuid
        partnerReference:
          type: string
          maxLength: 128
        servicing:
          $ref: "#/components/schemas/ServicingOutcome"
        outcome:
          type: object
          additionalProperties: false
          required:
            - decidedAt
          description: Present once a human has decided.
          properties:
            decidedAt:
              $ref: "#/components/schemas/AttestedInstant"
            reasonCode:
              type: string
              maxLength: 64
              description: Present on `REJECTED`. Names the control or policy reason.
            note:
              type: string
              maxLength: 500
              description: Present on `RETURNED_TO_MAKER`. What needs changing.
        transaction:
          type: object
          additionalProperties: false
          required:
            - transactionId
            - state
          description: |
            Present once an approved request has been opened as a transaction.
            The state is `DRAFT` and can be nothing else here — this is the
            beginning of the sequence, not the end of it.
          properties:
            transactionId:
              type: string
              format: uuid
            state:
              type: string
              enum:
                - DRAFT
    ControlCode:
      type: string
      description: |
        The control that refused the request. Never a generic decline: the
        counterparty surface renders this into a specific, respectful Arabic
        explanation, and the Board's audit workspace indexes on it.
      enum:
        - SH-01
        - SH-02
        - SH-03
        - SH-04
        - SH-05
        - SH-06
        - SH-07
        - SH-08
        - SH-09
        - SH-10
        - SH-11
        - SH-12
        - SH-13
        - SH-14
        - SH-15
        - SH-16
        - SH-17
        - SH-18
        - OP-DETERMINACY
        - OP-CHAIN
        - OP-LIMIT
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - detailAr
        - correlationId
      description: |
        RFC 9457 problem details, with two additions.

        `control` and `reason` are the machine-readable pair: the control that
        refused, and why. `detail`/`detailAr` are both always present —
        bilingual is a requirement of the product, not a localisation feature,
        and an English-only refusal cannot be shown to a counterparty.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: English.
        detailAr:
          type: string
          description: Arabic. Always present.
        instance:
          type: string
          format: uri-reference
        correlationId:
          type: string
          format: uuid
        control:
          $ref: "#/components/schemas/ControlCode"
        reason:
          type: string
          maxLength: 64
          description: Stable machine reason, e.g. `INVOICE_ALREADY_FINANCED`.
          example: INVOICE_ALREADY_FINANCED
        context:
          type: object
          description: |
            Structured context for the audit trail. Scalars only, and never a
            national identifier, a personal datum or a credential — problem
            details are logged, forwarded and shown on screens.
          additionalProperties: {}
  responses:
    Malformed:
      description: |
        The body could not be accepted as written — a missing required field,
        a wrong type, or an unknown property. An unknown property is an error
        rather than a silent drop; see the note on closed schemas.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unknownProperty:
              summary: A field that does not exist in this system
              value:
                type: https://sanad.example/problems/malformed-request
                title: Malformed request
                status: 400
                detail: Unknown property. Return in this system is expressed as a profit amount added to a disclosed
                  cost, never as a proportion, and there is no field to carry one.
                detailAr: حقل غير معروف. يُعبَّر عن العائد بمبلغ ربح يُضاف إلى تكلفة مُفصح عنها، لا بنسبة، ولا يوجد
                  حقل يحملها.
                correlationId: 018f3a2f-0000-7000-8000-000000000001
                control: SH-01
                reason: UNKNOWN_PROPERTY
    Unauthenticated:
      description: No valid credential. The service verifies this itself and does not rely on the gateway.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: |
        Authenticated, but not entitled — including any attempt to read or act
        on a request belonging to another partner or another tenant.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: |
        No such request within this partner's scope. A request that exists for
        another partner is reported as absent rather than forbidden, so the
        API does not confirm the existence of other partners' business.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    IdempotencyConflict:
      description: |
        The `Idempotency-Key` has been used with a different body. The stored
        result is not returned and the new instruction is not performed — one
        of the two is a defect and guessing which would be worse than failing.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ControlRejection:
      description: |
        Well-formed, and refused by a control.

        Distinguished from `400` on purpose: the body was understood. Retrying
        it unchanged will be refused again. `control` names what refused.
      content:
        application/problem+json:
