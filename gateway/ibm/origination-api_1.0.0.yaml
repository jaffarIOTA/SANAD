        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /requests/{requestId}:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      tags:
        - Requests
      operationId: getOriginationRequest
      summary: Read a request.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The request.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OriginationRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
  /requests/{requestId}/withdrawal:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    put:
      tags:
        - Requests
      operationId: withdrawOriginationRequest
      summary: Withdraw a request the partner raised.
      description: |
        Withdrawal is the only state change a partner may cause after raising.
        It is available while the request is still open; once it has been
        approved or rejected there is nothing to withdraw and the call is
        refused with `422`.

        Modelled as `PUT` on a sub-resource rather than `POST /withdraw`,
        because withdrawal is idempotent by nature: withdrawing an already
        withdrawn request is the same outcome, not an error.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: |
                    Free text, retained on the request. Must not contain a
                    national identifier or any personal datum; this field is
                    surfaced in the audit workspace.
      responses:
        "200":
          description: The request is withdrawn.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
            Idempotent-Replay:
              $ref: "#/components/headers/IdempotentReplay"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OriginationRequest"
        "400":
          $ref: "#/components/responses/Malformed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "422":
          $ref: "#/components/responses/ControlRejection"
        "429":
