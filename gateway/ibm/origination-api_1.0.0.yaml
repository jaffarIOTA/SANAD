openapi: 3.0.3
info:
  title: Sanad Origination API
  version: 1.0.0
  description: |
    An origination request is an **instruction to originate**, not a credit.

    This is the distinction most likely to be misread by a team integrating
    from a conventional lending background, so it is stated here rather than
    buried. In a loan origination system, approval is the moment the credit
    exists. Here it is not. An approved request buys exactly one thing: the
    right to open a transaction in `DRAFT`, at the very start of a sequence
    that must then validate the trade, reserve limit, execute a purchase,
    evidence ownership, evidence possession, and hold the goods at the
    institution's own risk for the Board's interval before any sale can be
    offered.

    There is no field in this API, and no entitlement behind it, that shortens
    that sequence. A `state` of `APPROVED` means a file was opened.

    **There is no rate.** Not in a request, not in a response, not in an error.
    Return on a Murabaha is a profit *amount* disclosed with the cost it is
    added to, and it is fixed once at inception. If your integration expects a
    periodic proportion to reconcile against, raise it with us rather than
    working around it — the concept does not exist in this system and adding
    it is a regulatory matter, not a backlog item.
  contact:
    name: Sanad platform
  license:
    name: Proprietary
  x-ibm-name: sanad-origination
servers:
  - url: https://api.{environment}.sanad.example/origination/v1
    description: Environment-scoped base URL. Supplied per integration.
    variables:
      environment:
        default: sandbox
        enum:
          - sandbox
          - uat
          - production
security:
  - partnerOAuth:
      - origination:read
      - origination:write
tags:
  - name: Requests
    description: Raising, reading and withdrawing origination requests.
paths:
  /requests:
    post:
      tags:
        - Requests
      operationId: raiseOriginationRequest
      summary: Raise an origination request.
      description: |
        Creates a request against a real trade.

        **A request always names a trade.** There is no amount-only form of
        this call. The trade is what is bought and sold; financing is the
        consequence of it. A body without a `tradeReference` is refused with
        `SH-03`, not accepted with a null.

        The channel is derived from the authenticated credential, and for both
        partner channels the servicing platform is consulted before any human
        sees the request. A successful call therefore returns
        `AWAITING_SERVICING_RESPONSE`, not `AWAITING_REVIEW`. Do not treat the
        `201` as an indication of appetite; it means the instruction was
        accepted as well-formed and is now in the institution's hands.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RaiseRequest"
            examples:
              partnerSystem:
                summary: A partner system raising against a cleared invoice
                value:
                  programmeId: 018f3a2c-7b41-7c9e-9a11-3f0c2d5e6a70
                  counterpartyId: 018f3a2c-7b41-7c9e-9a11-4b1d3e6f7a81
                  tradeReference:
                    type: CLEARED_INVOICE
                    invoiceUuid: 018f3a2d-1c22-7d3e-8f44-5a6b7c8d9e01
                    invoiceHash: 9f2c1a7e5d3b08462fbc19a7d4e5061c8a3b2d9e7f01234556789abcdef01234
                    issuerCr: "1010223344"
                    recipientCr: "2050667788"
                  requestedAmount:
                    minorUnits: "48500000"
                    currency: SAR
                  requestedTenorDays: 90
                  initiator:
                    kind: PARTNER_SYSTEM
              aggregatorOnBehalf:
                summary: An aggregator nominating a merchant it serves
                value:
                  programmeId: 018f3a2c-7b41-7c9e-9a11-3f0c2d5e6a70
                  counterpartyId: 018f3a2c-7b41-7c9e-9a11-4b1d3e6f7a81
                  tradeReference:
                    type: PURCHASE_ORDER
                    issuerCr: "1010223344"
                    recipientCr: "2050667788"
                  requestedAmount:
                    minorUnits: "12000000"
                    currency: SAR
                  requestedTenorDays: 60
                  initiator:
                    kind: AGGREGATOR_ON_BEHALF
                    merchantMandateRef: mnd_018f3a2e4477c1
      responses:
        "201":
          description: The request was accepted and is now with the institution.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
            Idempotent-Replay:
              $ref: "#/components/headers/IdempotentReplay"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OriginationRequest"
        "400":
          $ref: "#/components/responses/Malformed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "422":
          $ref: "#/components/responses/ControlRejection"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      tags:
        - Requests
      operationId: listOriginationRequests
      summary: List the requests this credential raised.
      description: |
        Scoped to the authenticated partner and tenant. A partner sees the
        requests it raised and nothing else; there is no query parameter that
        widens that, and supplying a tenant is rejected.
      parameters:
