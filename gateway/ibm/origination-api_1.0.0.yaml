          timeout: 30
          cache-response: no-cache
          backend-type: detect
          stop-on-error: []
          error-control: ProtocolError
x-sanad-not-expressible:
  note: Constraints present in the OpenAPI 3.1 contract that OpenAPI 3.0 cannot express. Each is
    enforced by the service. The gateway cannot check them, which is correct — the gateway is not
    the security boundary.
  source: api/openapi/origination.v1.yaml
  constraints:
    - "$.components.schemas.TradeReference.allOf[0].if: `if` conditional — enforced by the service
      only"
    - "$.components.schemas.TradeReference.allOf[0].then: `then` conditional — enforced by the
      service only"
    - "$.components.schemas.Problem.properties.context.additionalProperties.type: union type
      [string, number, boolean] — no 3.0 equivalent"
    - "$.webhooks: no 3.0 equivalent — the callback contract lives in the 3.1 source"
    - "$.components.securitySchemes.mutualTls: `type: mutualTLS` is 3.1-only — mTLS is terminated at
      the gateway and is not declarable here"
