# Kong Gateway — declarative configuration.
#
# DB-less. There is no PostgreSQL behind this gateway and there should not be:
# it removes a stateful component from the estate, it is what makes this file
# the source of truth rather than a snapshot of one, and it makes the move
# between a self-hosted control plane and a hosted one a matter of applying the
# same file somewhere else.
#
# Apply with decK:
#   deck gateway sync --state gateway/kong/kong.yaml
#
# Every plugin below is in the open-source distribution. That is a constraint,
# not a coincidence — see ClaudeRecommendations.md E-11. The one enterprise
# feature we would otherwise want is `mtls-auth`, and the answer is to
# terminate mTLS at the load balancer in front of Kong rather than to buy a
# licence for it.

_format_version: "3.0"
_transform: true

services:
  # One service. The origination API's whole surface is four operations, and
  # splitting it would multiply the per-service charge on a hosted control
  # plane for no operational benefit.
  - name: origination-v1
    # Resolved per environment by decK variables, never hardcoded to a host.
    url: ${ORIGINATION_UPSTREAM}
    protocol: http
    retries: 0            # Retries belong to the caller, who holds the
                          # idempotency key. A gateway retry without one is how
                          # a request executes twice.
    connect_timeout: 3000
    write_timeout: 30000
    read_timeout: 30000

    routes:
      - name: origination-v1-routes
        paths:
          - /origination/v1
        strip_path: false   # The service owns its own base path.
        protocols:
          - https           # No plaintext listener. Ever.
        methods:
          - GET
          - POST
          - PUT

plugins:
  # -- Request size -----------------------------------------------------------
  # Matches the service's own 64 KiB bound. Declared in both places on purpose:
  # the gateway sheds load early, the service stays correct without it.
  - name: request-size-limiting
    config:
      allowed_payload_size: 1        # megabytes, the plugin's unit
      size_unit: megabytes
      require_content_length: false

  # -- Rate limiting ----------------------------------------------------------
  #
  # `policy: local` counts per data-plane node. With three nodes behind a load
  # balancer a caller limited to 600/minute actually receives 1800. That is
  # acceptable as a coarse shedding control and is NOT acceptable as a
  # contractual limit.
  #
  # A single cluster-wide limit needs shared counters, which for Kong means
  # Redis — see ClaudeRecommendations.md E-14. Until that is decided this stays
  # local and deliberately generous, because a gateway limit that silently
  # varies with node count is worse than an honest coarse one.
  - name: rate-limiting
    config:
      minute: 600
      policy: local
      fault_tolerant: true           # A limiter outage must not take the API
                                     # down; the service is still protected by
                                     # its own bounds.
      hide_client_headers: false

  # -- Correlation ------------------------------------------------------------
  # The service generates one when absent and echoes it either way. This makes
  # sure a request that never reaches the service still has an identifier in
  # the gateway's own logs.
  - name: correlation-id
    config:
      header_name: X-Correlation-Id
      generator: uuid
      echo_downstream: true

  # -- CORS -------------------------------------------------------------------
  # This is a server-to-server API. No browser origin is allowed, and the empty
  # list is the statement of that rather than an oversight.
  - name: cors
    config:
      origins: []
      credentials: false
      max_age: 3600

# -- Deliberately absent -------------------------------------------------------
#
# No authentication plugin. Not key-auth, not jwt, not oidc.
#
# This looks like an omission and is not. The service authenticates every
# request itself against its own credential registry and derives tenant,
# channel and partner from the credential (§5, §8). A gateway auth plugin here
# would add a second, weaker identity source and create exactly the dependency
# that makes a gateway unswappable — and it is the requirement that would
# otherwise force an enterprise licence.
#
# No request-transformer. A gateway that rewrites a body is a gateway that can
# change an amount.
#
# No response-transformer. Problem details are RFC 9457 and bilingual as the
# service emits them; a gateway rewriting them would strip the control code
# that a compliance rejection exists to carry.
